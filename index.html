    <!-- Bular react-helmet-async orqali har bir sahifada individual

         o'qiydi — shuning uchun Open Graph/Twitter teglar shu yerda statik
         (umumiy) holatda turishi shart, aks holda link ulashganda preview
         chiqmay qoladi. -->
    <meta property="og:site_name" content="Rising Chemicals" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:title" content="Rising Chemicals — sanoat va laboratoriya kimyoviy mahsulotlari" />

      property="og:description"
      content="Reaktivlar, erituvchilar, kalibrlash gaz aralashmalari (ПГС) va boshqa sanoat kimyosi mahsulotlari — ishonchli narxlarda, tez yetkazib berish bilan."
    />
